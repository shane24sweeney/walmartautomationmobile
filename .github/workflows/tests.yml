name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      groups:
        description: "JUnit tags to run, e.g. smoke (blank runs everything)"
        required: false
        default: ""

# The JUnit report step publishes a check run with the failed tests.
permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI emulators are slower than a laptop; give every explicit wait more room.
  WAIT_TIMEOUT: "20"
  GROUPS_ARG: ${{ inputs.groups && format('-Dgroups={0}', inputs.groups) || '' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs Appium, its drivers (.appium/) and downloads the app builds (apps/).
      - run: npm ci

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: ci
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # UiAutomator2 attaches to the running emulator whose AVD name matches -Davd.
          script: mvn -B test -Dplatform=android -Davd=ci $GROUPS_ARG

      # Lists each failed test with its message and stack trace on the run's summary and checks page.
      - name: Publish JUnit results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: android tests
          detailed_summary: true
          include_skipped: true

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: npm run report

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-results
          path: |
            target/allure-report/
            target/failure-artifacts/
            target/surefire-reports/
            target/test.log
            appium-*.log
            target/appium-http.log
          if-no-files-found: ignore

  # macOS minutes count 10x against a private repo's Actions quota, so iOS runs on demand only.
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runner images ship different simulators over time, so use whichever iPhone is installed.
      - name: Pick an iPhone simulator
        run: |
          name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using simulator: $name"
          echo "DEVICE_NAME=$name" >> "$GITHUB_ENV"

      - name: Run tests on an iOS simulator
        run: mvn -B test -Dplatform=ios $GROUPS_ARG

      # Lists each failed test with its message and stack trace on the run's summary and checks page.
      - name: Publish JUnit results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: ios tests
          detailed_summary: true
          include_skipped: true

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: npm run report

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-results
          path: |
            target/allure-report/
            target/failure-artifacts/
            target/surefire-reports/
            target/test.log
            appium-*.log
            target/appium-http.log
          if-no-files-found: ignore
