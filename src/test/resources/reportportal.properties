# Read by the ReportPortal agent, which is only on the classpath with the reportportal Maven profile.
# Any value can be overridden with -D, e.g. -Drp.endpoint=https://rp.example.com. The API key comes
# from the RP_API_KEY environment variable (see the profile in pom.xml), never from this file.
rp.endpoint = http://localhost:8080
rp.project = superadmin_personal
rp.launch = walmartautomationmobile
rp.enable = true
# Skipped tests (e.g. the iOS-only dropdown limitation) are expected, so don't mark them as issues.
rp.skipped.issue = false
